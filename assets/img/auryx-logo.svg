<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" role="img" aria-labelledby="title desc">
  <title id="title">Logo AuryxTech</title>
  <desc id="desc">Monograma AT dourado com o nome Auryx Tech abaixo.</desc>
  <defs>
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c8"/>
      <stop offset="20%" stop-color="#e8ca76"/>
      <stop offset="48%" stop-color="#b9892a"/>
      <stop offset="76%" stop-color="#73511a"/>
      <stop offset="100%" stop-color="#f0d284"/>
