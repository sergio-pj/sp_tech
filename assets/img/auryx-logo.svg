      <polygon points="110,74 168,74 168,222 142,194 142,116" fill="#bc8b29" opacity="0.86"/>
      <polygon points="168,74 204,116 204,222 168,222" fill="#604115" opacity="0.92"/>
      <polygon points="110,222 142,194 168,222" fill="#ddb55a" opacity="0.86"/>
