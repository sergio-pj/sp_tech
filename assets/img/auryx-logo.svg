      <polygon points="152,82 206,54 164,154" fill="#efcf78" opacity="0.96"/>
      <polygon points="206,54 246,214 190,214 164,154" fill="#5d3e12" opacity="0.92"/>
      <polygon points="28,116 66,214 0,214" fill="#6f4b16" opacity="0.92"/>
      <polygon points="90,154 66,214 190,214 164,154" fill="#cf9f3b" opacity="0.88"/>
      <polygon points="90,154 121,116 160,154" fill="#fff0bc" opacity="0.88"/>
